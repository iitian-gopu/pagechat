services:
  - type: web
    name: pagechat-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MESH_API
        sync: false   # paste the secret in the Render dashboard, never in git
