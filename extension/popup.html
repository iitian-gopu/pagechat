<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PageChat</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Page<em>Chat</em></h1>
    </div>
    <div class="topbar-right">
      <span id="statusDot" class="status" title="Checking backend…"></span>
      <button id="newChatBtn" class="ghost-btn" title="Start a new chat">New chat</button>
    </div>
  </header>

  <main id="chatLog" class="chat-log" aria-live="polite">
    <div class="empty-state" id="emptyState">
      <p class="empty-title">Ask this page anything</p>
      <p class="empty-sub">The answer comes from the page you're on. If it isn't there, the web is searched for you.</p>
    </div>
  </main>

    <div class="composer-row">
      <textarea id="queryInput" rows="1"
