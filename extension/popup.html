<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PageChat</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Page<em>Chat</em></h1>
    </div>
    <div class="topbar-right">
      <span id="statusDot" class="status" title="Checking backend…"></span>
      <button id="newChatBtn" class="ghost-btn" title="Start a new chat">New chat</button>
    </div>
  </header>

  <main id="chatLog" class="chat-log" aria-live="polite">
    <div class="empty-state" id="emptyState">
      <p class="empty-title">Ask this page anything</p>
      <p class="empty-sub">The answer comes from the page you're on. If it isn't there, the web is searched for you.</p>
    </div>
  </main>

  <footer class="composer">
    <div class="composer-row">
      <textarea id="queryInput" rows="1"
        placeholder="Ask about this page…  (Enter to send)"></textarea>
      <button id="sendBtn" title="Send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
             stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>
    <div class="composer-meta">
      <select id="modelSelect" title="Model">
